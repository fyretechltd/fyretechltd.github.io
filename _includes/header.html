<header class="site-header">
  {% capture brand %}<a href="/"><img src="/favicon.svg" alt="" width="32" height="32">{{ site.title }}</a>{% endcapture %}
  {% if page.url == "/" %}
  <h1 class="site-name">{{ brand }}</h1>
  {% else %}
  <div class="site-name">{{ brand }}</div>
  {% endif %}
  <details class="menu">
    <summary><span class="menu-icon" aria-hidden="true"></span><span class="visually-hidden">Menu</span></summary>
    <nav aria-label="Main">
      {% include nav-links.html %}
    </nav>
  </details>
</header>
